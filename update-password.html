<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | C1PX CRM</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:Inter,Arial,sans-serif;color:#111827;padding:20px}.card{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:30px;box-shadow:0 20px 60px rgba(15,23,42,.12)}.logo{font-weight:800;font-size:28px;letter-spacing:.5px;margin-bottom:4px}h1{margin:0 0 8px;font-size:24px}p{color:#64748b;font-size:14px;line-height:1.5}label{display:block;font-weight:600;font-size:14px;margin:18px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:22px;background:#111827;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.message{margin-top:15px;font-size:14px;line-height:1.5}.success{color:#15803d}.error{color:#dc2626}a{color:#111827;font-weight:600}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">C1PX</div>
    <h1>Set a new password</h1>
    <p>JMD Property CRM. Enter your new password below.</p>
    <form id="resetForm">
      <label for="password">New Password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="Minimum 6 characters">
      <label for="confirm">Confirm Password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Re-enter your password">
      <button id="submitButton" type="submit">Update Password</button>
      <div id="message" class="message"></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://zdevrwucxvocoftxcide.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_y6lclqJvtRbOAh-BspEixw_3NU-OEhJ";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form=document.getElementById("resetForm"),button=document.getElementById("submitButton"),message=document.getElementById("message");
    function showMessage(text,type){message.textContent=text;message.className="message "+(type||"")}
    async function prepareRecoverySession(){
      try{
        const params=new URLSearchParams(window.location.search),code=params.get("code");
        if(code){const {error}=await db.auth.exchangeCodeForSession(code);if(error)throw error;window.history.replaceState({},document.title,window.location.pathname)}
        const {data,error}=await db.auth.getSession();if(error)throw error;
        if(!data.session)throw new Error("This password reset link is invalid or has expired. Please request a new reset email.");
      }catch(error){console.error("C1PX recovery session error:",error);form.style.display="none";showMessage(error.message||"This password reset link is invalid or has expired.","error")}
    }
    db.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY")form.style.display=""});
    form.addEventListener("submit",async event=>{
      event.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;
      if(password.length<6)return showMessage("Password must be at least 6 characters.","error");
      if(password!==confirm)return showMessage("Passwords do not match.","error");
      button.disabled=true;button.textContent="Updating...";showMessage("");
      try{const {error}=await db.auth.updateUser({password});if(error)throw error;showMessage("Password updated successfully. You can now log in to C1PX CRM.","success");form.reset();setTimeout(async()=>{await db.auth.signOut();window.location.href="https://jmdproperty.github.io/"},1800)}
      catch(error){console.error("C1PX password update error:",error);showMessage(error.message||"Unable to update password. Please request a new reset email.","error");button.disabled=false;button.textContent="Update Password"}
    });
    prepareRecoverySession();
  </script>
</body>
</html>
